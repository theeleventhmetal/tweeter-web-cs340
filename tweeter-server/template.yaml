# AI-assisted: see AI-ATTRIBUTION.md
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  tweeter-server - Lambda + API Gateway backend for the Tweeter Milestone 3 Web API.
  Every endpoint is POST, with the auth token in the JSON body (per course guidance,
  this keeps API Gateway configuration simple compared to REST-ful verbs/headers).

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128
    # Every Lambda calls AuthorizationService.validate() on every
    # authenticated request, so every Lambda needs the SESSIONS_TABLE_NAME
    # env var - granted here once instead of repeated on all 14 functions
    # below. SAM's Globals.Function does NOT support Policies (confirmed via
    # sam validate), so each function's own Policies list below still needs
    # its own DynamoDBCrudPolicy grant on SessionsTable.
    Environment:
      Variables:
        SESSIONS_TABLE_NAME: !Ref SessionsTable

Resources:
  TweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/LoginFunction
      Handler: index.handler
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /login
            Method: post

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/LogoutFunction
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        LogoutApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /logout
            Method: post

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetUserFunction
      Handler: index.handler
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        GetUserApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /get-user
            Method: post

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/RegisterFunction
      Handler: index.handler
      Environment:
        Variables:
          USERS_TABLE_NAME: !Ref UsersTable
          IMAGES_BUCKET_NAME: !Ref ProfileImagesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - S3CrudPolicy:
            BucketName: !Ref ProfileImagesBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /register
            Method: post

  IsFollowerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/IsFollowerFunction
      Handler: index.handler
      Environment:
        Variables:
          FOLLOWS_TABLE_NAME: !Ref FollowsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        IsFollowerApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /is-follower
            Method: post

  GetFolloweeCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFolloweeCountFunction
      Handler: index.handler
      Environment:
        Variables:
          FOLLOWS_TABLE_NAME: !Ref FollowsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        GetFolloweeCountApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /followee-count
            Method: post

  GetFollowerCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFollowerCountFunction
      Handler: index.handler
      Environment:
        Variables:
          FOLLOWS_TABLE_NAME: !Ref FollowsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        GetFollowerCountApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /follower-count
            Method: post

  FollowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/FollowFunction
      Handler: index.handler
      Environment:
        Variables:
          FOLLOWS_TABLE_NAME: !Ref FollowsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        FollowApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /follow
            Method: post

  UnfollowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/UnfollowFunction
      Handler: index.handler
      Environment:
        Variables:
          FOLLOWS_TABLE_NAME: !Ref FollowsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        UnfollowApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /unfollow
            Method: post

  GetFolloweesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFolloweesFunction
      Handler: index.handler
      Environment:
        Variables:
          FOLLOWS_TABLE_NAME: !Ref FollowsTable
          USERS_TABLE_NAME: !Ref UsersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        GetFolloweesApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /followees
            Method: post

  GetFollowersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFollowersFunction
      Handler: index.handler
      Environment:
        Variables:
          FOLLOWS_TABLE_NAME: !Ref FollowsTable
          USERS_TABLE_NAME: !Ref UsersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        GetFollowersApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /followers
            Method: post

  GetFeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFeedFunction
      Handler: index.handler
      Environment:
        Variables:
          FEED_TABLE_NAME: !Ref FeedTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        GetFeedApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /feed
            Method: post

  GetStoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetStoryFunction
      Handler: index.handler
      Environment:
        Variables:
          STORY_TABLE_NAME: !Ref StoryTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        GetStoryApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /story
            Method: post

  PostStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/PostStatusFunction
      Handler: index.handler
      Environment:
        Variables:
          FOLLOWS_TABLE_NAME: !Ref FollowsTable
          STORY_TABLE_NAME: !Ref StoryTable
          FEED_TABLE_NAME: !Ref FeedTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FollowsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StoryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FeedTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        PostStatusApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /post-status
            Method: post

  # Further Lambda functions are added here one at a time, each with an
  # Events: Api entry pointing at TweeterApi, as each Milestone 3 task is
  # completed.

  # DynamoDB tables and the S3 bucket are added here one at a time, each
  # paired with the DAO(s) and Lambda Policies/Environment entries that use
  # it, as each Milestone 4A task is completed. PAY_PER_REQUEST billing mode
  # so there's no idle provisioned RCU/WCU to remember to turn down between
  # sessions.
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alias
          AttributeType: S
      KeySchema:
        - AttributeName: alias
          KeyType: HASH

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # PK followerAlias/SK followeeAlias answers "who does X follow"; the GSI
  # swaps the key order to answer "who follows X" without a table scan.
  FollowsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: followerAlias
          AttributeType: S
        - AttributeName: followeeAlias
          AttributeType: S
      KeySchema:
        - AttributeName: followerAlias
          KeyType: HASH
        - AttributeName: followeeAlias
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: followee-index
          KeySchema:
            - AttributeName: followeeAlias
              KeyType: HASH
            - AttributeName: followerAlias
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # A user's own posted statuses (the Story tab). Items store the full
  # denormalized StatusDto shape so reads need no join back to Users.
  StoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alias
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: alias
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  # Each user's pre-computed feed (posts from people they follow). Same
  # denormalized StatusDto shape as Story - populated by fan-out-on-write
  # from postStatus, not assembled at read time, per the spec's requirement.
  FeedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alias
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: alias
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  # Public-read bucket for profile images. Ownership/public-access settings
  # are declared here (rather than left as manual console steps) so ACL
  # uploads and public GETs work as soon as this stack is deployed.
  ProfileImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

Outputs:
  TweeterApiUrl:
    Description: "Base URL of the Tweeter Web API"
    Value: !Sub "https://${TweeterApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
