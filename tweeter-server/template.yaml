# AI-assisted: see AI-ATTRIBUTION.md
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  tweeter-server - Lambda + API Gateway backend for the Tweeter Milestone 3 Web API.
  Every endpoint is POST, with the auth token in the JSON body (per course guidance,
  this keeps API Gateway configuration simple compared to REST-ful verbs/headers).

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128

Resources:
  TweeterApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/LoginFunction
      Handler: index.handler
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /login
            Method: post

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/LogoutFunction
      Handler: index.handler
      Events:
        LogoutApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /logout
            Method: post

  GetUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetUserFunction
      Handler: index.handler
      Events:
        GetUserApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /get-user
            Method: post

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/RegisterFunction
      Handler: index.handler
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /register
            Method: post

  IsFollowerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/IsFollowerFunction
      Handler: index.handler
      Events:
        IsFollowerApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /is-follower
            Method: post

  GetFolloweeCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFolloweeCountFunction
      Handler: index.handler
      Events:
        GetFolloweeCountApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /followee-count
            Method: post

  GetFollowerCountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFollowerCountFunction
      Handler: index.handler
      Events:
        GetFollowerCountApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /follower-count
            Method: post

  FollowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/FollowFunction
      Handler: index.handler
      Events:
        FollowApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /follow
            Method: post

  UnfollowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/UnfollowFunction
      Handler: index.handler
      Events:
        UnfollowApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /unfollow
            Method: post

  GetFolloweesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFolloweesFunction
      Handler: index.handler
      Events:
        GetFolloweesApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /followees
            Method: post

  GetFollowersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist-lambdas/GetFollowersFunction
      Handler: index.handler
      Events:
        GetFollowersApi:
          Type: Api
          Properties:
            RestApiId: !Ref TweeterApi
            Path: /followers
            Method: post

  # Further Lambda functions are added here one at a time, each with an
  # Events: Api entry pointing at TweeterApi, as each Milestone 3 task is
  # completed.

Outputs:
  TweeterApiUrl:
    Description: "Base URL of the Tweeter Web API"
    Value: !Sub "https://${TweeterApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
